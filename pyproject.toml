[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "usage-tray"
version = "0.1.0"
description = "Claude Code usage meter and done/needs-you notifications in the Windows tray"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["pystray>=0.19", "Pillow>=10"]

[project.scripts]
usage-tray = "usage_tray.app:main"

[tool.setuptools]
packages = ["usage_tray"]
